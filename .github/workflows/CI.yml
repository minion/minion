name: CI

# Trigger the workflow on push or pull request
on:
  workflow_dispatch:
    inputs:
      # see https://github.com/marketplace/actions/debugging-with-tmate
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        type: boolean
  pull_request:
  push:
  schedule:
    # Every day at 2:30 AM UTC
    - cron: '30 2 * * *'



jobs:
  docs:
    name: docs sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: "Documentation sync check"
        run: python3 sphinxdocs/check-docs-sync.py

  sphinx:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Matches the Python in .readthedocs.yaml, so a build that passes here
      # is a build Read the Docs can make.
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Sphinx"
        run: pip install -r sphinxdocs/requirements.txt

      # -W turns warnings into errors; the docs currently build clean.
      - name: "Build the documentation"
        run: python3 -m sphinx -W -b html sphinxdocs sphinxdocs/_build/html

  # Every other job configures with --quick, which defines QUICK_COMPILE and
  # so compiles out the per-variable-type specialisations in
  # BuildConstraintConstructs.h: each constraint is then built only through
  # the generic AnyVarRef path. auto-release.yml builds the Linux and macOS
  # binaries without --quick, so without this job the code a release ships
  # is never compiled or run in CI.
  full:
    name: full build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: "Config"
        run: |
                mkdir bin-full
                cd bin-full
                python3 ../configure.py

      - name: "Build"
        run: |
                cd bin-full
                make -j2

      # The regression instances between them declare BOOL, DISCRETE, BOUND
      # and SPARSEBOUND variables, which is what selects between the
      # specialisations this job exists to compile.
      - name: "Regression suite"
        run: |
              cd test_instances
              bash ./run_tests.sh ../bin-full/minion

      - name: "Library tests"
        run: |
              cd bin-full
              make test

  # --domains64 makes SysInt 64-bit, which nothing else in CI compiles, and
  # tests-64domains/ needs values past a 32-bit domain so it is the only place
  # those instances mean anything. The Rust tester is deliberately not run
  # here: it does not generate domains that large, so it would test the same
  # ground as the other jobs at twice the width.
  domains64:
    name: 64-bit domains
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: "Config"
        run: |
                mkdir bin-d64
                cd bin-d64
                python3 ../configure.py --domains64 --quick

      - name: "Build"
        run: |
                cd bin-d64
                make -j2

      - name: "Basic tests, including tests-64domains"
        run: |
              cd test_instances
              TEST_64DOMAINS=1 bash ./do_basic_tests.sh ../bin-d64/minion

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # GitHub cancels a job at its 6 h default with no useful diagnostic —
    # every scheduled run from at least 2026-07-12 died that way, stuck in
    # the exec-mode tester step below. Fail loudly and early instead. The
    # deliberately long soak lives in mini-scripts/, run locally.
    timeout-minutes: 120
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # The in-process sweeps run every constraint by default, which is
      # far too much per push -- the injection step alone once ran for 90
      # minutes and timed the job out. Smoke a fixed selection instead:
      # the propagator families that have actually produced bugs, plus a
      # meta-constraint for the nested path. Full coverage is in
      # mini-scripts/.
      SMOKE: >-
        --constraints gcc --constraints gccweak --constraints occurrence
        --constraints watchsumgeq --constraints litsumgeq
        --constraints haggisgac --constraints table --constraints element
        --constraints gacalldiff --constraints lexleq
        --constraints watchvecneq --constraints reify
        --constraints watched-or
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [bash]
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: "Config"
        run: |
                mkdir bin-quick
                cd bin-quick
                python3 ../configure.py --quick
      
      - name: "Build"
        run: |
                cd bin-quick
                make -j2
      
      - name: "First test"
        run: |
              cd test_instances
              bash ./run_tests.sh ../bin-quick/minion
      
      # Bounded explicitly rather than run on the tester's defaults. One
      # exec-mode invocation runs nine sweeps (baseline, nested, -parallel,
      # work-steal, work-steal portfolio, parallel-preprocess, restarts,
      # variant-equivalence, options) across every constraint, and the three
      # adaptive sweeps double instance size per constraint until they see a
      # donation or hit --ws-max-size. At the defaults (--count 30,
      # --optioncount 1000, --ws-max-size 32) that does not finish inside a
      # 6 h job. --ws-max-size 1 pins the adaptive sweeps to a single round;
      # the sizes that actually exercise donation live in
      # mini-scripts/soak-parallel.sh.
      - name: "Rust tests"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --minion ../bin-quick/minion \
                --count 5 --variant-count 5 --optioncount 200 \
                --ws-max-size 1 --numthreads 4

      # Exercises the deep-nested (cross-type parent trees) path that the
      # Rust tests step above doesn't touch. --variant-count 0 skips the
      # variant-equivalence sweep, which the step above already ran and
      # which doesn't depend on --nest-depth.
      #
      # Deliberately at --size-factor 1. At --size-factor 2 a *single*
      # trial can run for tens of minutes, so bounding --count does not
      # bound wall clock: --count 2 here was still inside the second of
      # seven sweeps after 25 minutes, at 24% CPU (one trial grinding,
      # not parallel work). The tester has no per-trial time limit, so
      # scaled-up instances belong in mini-scripts/, not on every push.
      - name: "Rust tests: nested smoke"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --minion ../bin-quick/minion \
                --count 5 --variant-count 0 --optioncount 100 \
                --nest-depth 2 --size-factor 1 --ws-max-size 1 --numthreads 4

      # minion-sys integration tests (test_work_steal, test_parallel_search,
      # test_seed_determinism, etc.). These exercise the FFI surface of
      # libminion via Rust, which the C++ `make test` doesn't cover.
      - name: "minion-sys cargo test"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd minion-sys
              cargo test --release

      - name: "Library tests"
        run: |
                cd bin-quick
                make test

      # Debug build: verifies MINION_DEBUG (checked-integer DomainInt,
      # _GLIBCXX_DEBUG) works for both the binary and the library.
      - name: "Debug config"
        run: |
                mkdir bin-debug
                cd bin-debug
                python3 ../configure.py --quick --debug

      - name: "Debug build"
        run: |
                cd bin-debug
                make -j2

      - name: "Debug library tests"
        run: |
                cd bin-debug
                make test

      - name: "Debug basic tests"
        run: |
              cd test_instances
              bash ./run_tests.sh ../bin-debug/minion

      # In-process runs go through minion-sys (the Rust FFI binding) and
      # reach the mid-search injection paths. Note --maxtuples, not
      # --max-solutions, is the per-run solution cap in the mid-search
      # modes -- those never consult --max-solutions. It also bounds
      # per-thread memory at roughly 1.5 GB times --numthreads.
      - name: "In-process tester: baseline sweep"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --in-process $SMOKE --count 3 --numthreads 4 --maxtuples 2000 --max-solutions 50000

      - name: "In-process tester: mid-search add-vars (no constraint on new vars)"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --in-process $SMOKE --midsearch --count 5 --numthreads 4 --maxtuples 2000

      - name: "In-process tester: mid-search constraint injection (N=1)"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --in-process $SMOKE --midsearch-constraints --count 5 --numthreads 4 --maxtuples 2000

      - name: "In-process tester: mid-search constraint injection (N=2)"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --in-process $SMOKE --midsearch-constraints --midsearch-constraints-num-packets 2 --count 3 --numthreads 4 --maxtuples 2000

      - name: "In-process tester: mid-search constraint injection wrapped in nested parent"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --in-process $SMOKE --midsearch-constraints --midsearch-wrap-nested --count 3 --numthreads 4 --maxtuples 2000

      - name: "In-process tester: mid-search add-vars + mixed-var constraint"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              cargo run --release -- --in-process $SMOKE --midsearch-add-vars --midsearch-constraints-num-packets 2 --count 15 --numthreads 4 --maxtuples 2000

      # Debug in-process test: rebuilds minion-sys with MINION_DEBUG so
      # the checked-integer DomainInt wrapper is exercised through the
      # FFI boundary. Placed last to avoid cargo cache thrashing with the
      # non-debug in-process steps above.
      - name: "In-process tester: debug baseline"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              DEBUG_MINION=1 cargo run --release -- --in-process $SMOKE --count 2 --numthreads 4 --maxtuples 2000 --max-solutions 50000

      - name: "In-process tester: debug mid-search constraint injection"
        run: |
              export PATH=$PATH:$HOME/.cargo/bin
              cd tester
              DEBUG_MINION=1 cargo run --release -- --in-process $SMOKE --midsearch-constraints --count 2 --numthreads 4 --maxtuples 2000
