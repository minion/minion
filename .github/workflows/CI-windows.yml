name: CI-windows

# Trigger the workflow on push or pull request
on:
  workflow_dispatch:
    inputs:
      # see https://github.com/marketplace/actions/debugging-with-tmate
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        type: boolean
  pull_request:
  push:
  schedule:
    # Every day at 2:30 AM UTC
    - cron: '30 2 * * *'



jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: win64

      - name: "Config"
        run: |
                mkdir bin-quick
                cd bin-quick
                python3 ../configure.py --quick --buildsystem bat
      
      - name: "Build"
        run: |
                cd bin-quick
                dir
                .\build.bat

      # Diagnostic only: run minion.exe directly, with nothing capturing
      # or filtering its output, so the log shows whether the binary runs
      # at all. The test harness below sends minion's stderr to
      # /dev/null and reports every failure as "Got '' solutions", which
      # cannot tell a crash apart from a parse problem.
      #
      # Runs under cmd rather than bash to keep git-bash out of the
      # picture: if the binary cannot start (a missing runtime DLL, say)
      # this shows the native Windows error.
      #
      # continue-on-error, because this step exists to produce evidence.
      # The real tests below still gate the job.
      - name: "Smoke: run minion.exe directly"
        shell: cmd
        continue-on-error: true
        run: |
              cd bin-quick
              dir minion.exe
              echo ----- no arguments: does it start at all -----
              minion.exe
              echo exit code: %ERRORLEVEL%
              echo ----- minimal instance -----
              minion.exe ..\test_instances\test_false_1.minion
              echo exit code: %ERRORLEVEL%
              echo ----- an instance the harness reports as failing -----
              minion.exe -findallsols ..\test_instances\alias_litsumgeq_consistent.minion
              echo exit code: %ERRORLEVEL%
              cd ..\test_instances
              echo ----- same command, same cwd, as the bash harness runs it -----
              echo These crash under git-bash with exit 139. Running them here
              echo under cmd says whether that is the shell or the solver.
              ..\bin-quick\minion.exe alias_gcc_capacity_selfref_1.minion -findallsols
              echo exit code: %ERRORLEVEL%
              ..\bin-quick\minion.exe alias_litsumgeq_consistent.minion -findallsols
              echo exit code: %ERRORLEVEL%
              ..\bin-quick\minion.exe alias_litsumgeq_contradiction.minion -findallsols
              echo exit code: %ERRORLEVEL%

      # The other half of the 2x2. The cmd step above covers
      # (cmd, bin-quick) and (cmd, test_instances); this covers the same
      # two working directories under git-bash, which is where the
      # harness sees exit 139. Between them they say whether the crash
      # follows the shell or the working directory.
      #
      # test_false_1 is deliberately included: it is trivial and runs
      # clean under cmd, so if it also crashes here the problem has
      # nothing to do with which instance is being solved.
      - name: "Smoke: run minion.exe from git-bash"
        shell: bash
        continue-on-error: true
        run: |
              # GitHub runs bash with -eo pipefail; without this the first
              # crash aborts the step and the later cases never run.
              set +e
              echo "----- bash, cwd=bin-quick, trivial instance -----"
              (cd bin-quick && ./minion.exe ../test_instances/test_false_1.minion); echo "exit: $?"
              echo "----- bash, cwd=test_instances, trivial instance -----"
              (cd test_instances && ../bin-quick/minion.exe test_false_1.minion); echo "exit: $?"
              echo "----- bash, cwd=test_instances, the failing instance -----"
              (cd test_instances && ../bin-quick/minion.exe alias_litsumgeq_consistent.minion -findallsols); echo "exit: $?"
              echo "----- bash, cwd=bin-quick, the failing instance -----"
              (cd bin-quick && ./minion.exe ../test_instances/alias_litsumgeq_consistent.minion -findallsols); echo "exit: $?"

      # Is git-bash itself the problem? Every line below runs in the SAME
      # step, shell, environment and working directory -- only the way
      # the process is launched changes. If (1) crashes and (2) does not,
      # the fault is in how git-bash starts the executable, not in
      # minion, the instance, or the environment.
      #
      # (3) re-runs it with the environment stripped, which separates
      # "git-bash launches it wrongly" from "git-bash exports something
      # that breaks it".
      - name: "Smoke: is it git-bash?"
        shell: bash
        continue-on-error: true
        run: |
              set +e
              cd test_instances
              echo "--- 1. launched directly by bash"
              ../bin-quick/minion.exe test_false_1.minion; echo "exit: $?"
              echo "--- 2. same command, same step, launched via cmd"
              cmd //c "..\bin-quick\minion.exe test_false_1.minion"; echo "exit: $?"
              echo "--- 3. launched by bash, environment stripped"
              env -i PATH="$PATH" ../bin-quick/minion.exe test_false_1.minion; echo "exit: $?"
              echo "--- 4. a different native exe, launched directly by bash"
              cmd //c ver; echo "exit: $?"
              echo "--- 5. what bash is actually looking at"
              ls -la ../bin-quick/minion.exe
              bash --version | head -1
              uname -a

      # The Rust tester is not run here: it depends on minion-sys, whose
      # build script builds libminion via bash/make and only knows how to
      # link the C++ runtime on apple and linux targets. Windows coverage
      # is the C++ binary plus the basic instance tests below.
      - name: "Basic tests"
        shell: bash
        run: |
              cd test_instances
              MINION_TEST_VERBOSE=1 bash ./do_basic_tests.sh ../bin-quick/minion.exe
