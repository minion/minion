name: CI-windows

# Trigger the workflow on push or pull request
on:
  workflow_dispatch:
    inputs:
      # see https://github.com/marketplace/actions/debugging-with-tmate
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        type: boolean
  pull_request:
  push:
  schedule:
    # Every day at 2:30 AM UTC
    - cron: '30 2 * * *'



jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: win64

      - name: "Config"
        run: |
                mkdir bin-quick
                cd bin-quick
                python3 ../configure.py --quick --buildsystem bat
      
      - name: "Build"
        run: |
                cd bin-quick
                dir
                .\build.bat

      # Diagnostic only: run minion.exe directly, with nothing capturing
      # or filtering its output, so the log shows whether the binary runs
      # at all. The test harness below sends minion's stderr to
      # /dev/null and reports every failure as "Got '' solutions", which
      # cannot tell a crash apart from a parse problem.
      #
      # Runs under cmd rather than bash to keep git-bash out of the
      # picture: if the binary cannot start (a missing runtime DLL, say)
      # this shows the native Windows error.
      #
      # continue-on-error, because this step exists to produce evidence.
      # The real tests below still gate the job.
      - name: "Smoke: run minion.exe directly"
        shell: cmd
        continue-on-error: true
        run: |
              cd bin-quick
              dir minion.exe
              echo ----- no arguments: does it start at all -----
              minion.exe
              echo exit code: %ERRORLEVEL%
              echo ----- minimal instance -----
              minion.exe ..\test_instances\test_false_1.minion
              echo exit code: %ERRORLEVEL%
              echo ----- an instance the harness reports as failing -----
              minion.exe -findallsols ..\test_instances\alias_litsumgeq_consistent.minion
              echo exit code: %ERRORLEVEL%
              cd ..\test_instances
              echo ----- same command, same cwd, as the bash harness runs it -----
              echo These crash under git-bash with exit 139. Running them here
              echo under cmd says whether that is the shell or the solver.
              ..\bin-quick\minion.exe alias_gcc_capacity_selfref_1.minion -findallsols
              echo exit code: %ERRORLEVEL%
              ..\bin-quick\minion.exe alias_litsumgeq_consistent.minion -findallsols
              echo exit code: %ERRORLEVEL%
              ..\bin-quick\minion.exe alias_litsumgeq_contradiction.minion -findallsols
              echo exit code: %ERRORLEVEL%

      # The Rust tester is not run here: it depends on minion-sys, whose
      # build script builds libminion via bash/make and only knows how to
      # link the C++ runtime on apple and linux targets. Windows coverage
      # is the C++ binary plus the basic instance tests below.
      # Driven from cmd, through Python, with no POSIX shell anywhere in
      # the chain. minion.exe cannot be launched from git-bash on these
      # runners -- it dies with exit 139 before printing anything,
      # regardless of working directory or instance, and whether bash
      # starts it directly or via cmd /c. The same binary run from cmd
      # solves every instance correctly, so the suite runs that way.
      # do_basic_tests.sh stays the runner on Linux and macOS.
      - name: "Basic tests"
        shell: cmd
        run: |
              python test_instances\run_basic_tests.py bin-quick\minion.exe
