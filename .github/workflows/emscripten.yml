name: Emscripten
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: [dom-assert, 'dom-assert,domains64']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Execute Wasm regressions and check unshared memory
        run: bash mini-scripts/test-emscripten.sh --features '${{ matrix.features }}'
      - name: Native ABI and regression tests
        run: cargo test --manifest-path minion-sys/Cargo.toml --release --features '${{ matrix.features }}'
